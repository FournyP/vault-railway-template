# Typechecks the Railway Infrastructure as Code definition. A broken
# .railway/railway.ts otherwise only surfaces once someone runs
# `railway config plan` against a live environment.
name: iac-typecheck

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
